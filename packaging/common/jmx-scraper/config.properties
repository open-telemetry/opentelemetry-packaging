## OpenTelemetry JMX scraper configuration.
## Set the endpoint and target system before enabling the service.
# otel.jmx.service.url=service:jmx:rmi:///jndi/rmi://localhost:9010/jmxrmi

## The target system selects which metric definitions are applied by the
## scraper. One or more values, separated by commas, for example "jvm,tomcat"
## to collect the JVM metrics alongside the Tomcat ones.
##
## The accepted values depend on the scraper version. For the list this one
## accepts, see opentelemetry-jmx-scraper(8) or
## /usr/share/doc/opentelemetry-jmx-scraper/README.md
# otel.jmx.target.system=jvm

## Do not put secrets in this file. The service runs under DynamicUser, so this
## file must stay world-readable for the service to read it at all. Put them in
## jmx-scraper.env instead, which systemd reads as root and which is not
## world-readable: OTEL_JMX_USERNAME and OTEL_JMX_PASSWORD for the JMX
## credentials, and OTEL_EXPORTER_OTLP_HEADERS for an OTLP API key.

## Set when the target JVM runs with com.sun.management.jmxremote.registry.ssl=true.
# otel.jmx.remote.registry.ssl=true

## Configure the OTLP metrics destination as needed.
# otel.exporter.otlp.endpoint=http://localhost:4317

## This file also accepts the OpenTelemetry Java SDK's autoconfiguration
## properties, for example:
# otel.exporter.otlp.protocol=grpc
# otel.service.name=
# otel.metric.export.interval=60000
##
## One exception: otel.exporter.otlp.headers is where an API key goes, so set
## OTEL_EXPORTER_OTLP_HEADERS in jmx-scraper.env rather than adding it here.

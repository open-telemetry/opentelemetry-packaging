name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+**"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: make lint

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the Go command unit tests
        run: make go-unit-tests

      - name: Run the sitecustomize.py unit tests
        run: make python-unit-tests

      - name: Run the vendored pyproto exporter test suites
        run: make pyproto-unit-tests

  sitecustomize-compatibility-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run sitecustomize.py under every supported Python interpreter generation
        run: make integration-test-sitecustomize

  build-packages:
    runs-on: ${{ matrix.ARCH == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        SYS_PACKAGE: [ "deb", "rpm" ]
        ARCH: [ "amd64", "arm64" ]
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF##*/}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.ARCH }} ${{ matrix.SYS_PACKAGE }} packages
        env:
          ARCH: ${{ matrix.ARCH }}
          SYS_PACKAGE: ${{ matrix.SYS_PACKAGE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: make "${SYS_PACKAGE}-packages" ARCH="${ARCH}" VERSION="${VERSION}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentelemetry-packages-${{ matrix.ARCH }}-${{ matrix.SYS_PACKAGE }}
          path: ./build/packages/*.${{ matrix.SYS_PACKAGE }}
          if-no-files-found: error

  integration-tests:
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        SYS_PACKAGE: [ "deb", "rpm" ]
        lang: [ "java", "nodejs", "dotnet", "python", "lifecycle", "vendor" ]
        arch: [ "amd64", "arm64" ]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentelemetry-packages-${{ matrix.arch }}-${{ matrix.SYS_PACKAGE }}
          path: ./build/packages

      - name: Run packaging integration tests for ${{ matrix.SYS_PACKAGE }}/${{ matrix.lang }}/${{ matrix.arch }}
        run: make integration-test-${{ matrix.SYS_PACKAGE }}-${{ matrix.lang }} ARCH=${{ matrix.arch }}

  publish-release:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'open-telemetry/opentelemetry-packaging'
    needs: integration-tests
    permissions:
      contents: write
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts/
          pattern: opentelemetry-packages-*

      - name: Stage release assets
        run: |
          # Architecture-independent packages (RPM noarch, DEB _all: the
          # metapackage plus the Java and Node.js agents) are built identically
          # by every ARCH matrix job, so each appears once per arch artifact
          # under the same filename. Flatten all artifacts into one directory so
          # each basename becomes a single release asset; the per-arch copies of
          # a noarch/all package share their NEVRA (only build metadata differs),
          # so collapsing them to one is correct. Without this, the release step
          # would try to upload two assets with the same name and fail.
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -f {} dist/ \;
          echo "=== Release assets ==="
          ls -1 dist | sort

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.deb dist/*.rpm)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --generate-notes \
              --verify-tag
          fi

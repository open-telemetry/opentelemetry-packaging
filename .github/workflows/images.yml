name: Package images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-images-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Changed method in packaging/images/config.go selects packages to build and publish.
  # It selects the affected package for component-specific changes, or all packages for shared tooling changes.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      packages: ${{ steps.plan.outputs.packages }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate build plan from image configuration
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            BEFORE=$(git merge-base "$BASE_SHA" HEAD)
          elif [[ "$EVENT" == workflow_dispatch ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # An empty base selects all packages for manual runs or missing history.
            BEFORE=""
          fi
          go run ./cmd/image-metadata -plan -base "$BEFORE" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    # One native build/test job per selected package and configured architecture.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Go unit tests
        run: make go-unit-tests

      - name: Build DEB, extract it into an image, and test package contents
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: make "integration-test-image-$COMPONENT" CONTAINER_ENGINE=docker

      # Keep architecture subdirectories so publication can merge these artifacts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-packages-${{ matrix.component }}-${{ matrix.arch }}
          path: build/images/${{ matrix.component }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    # Only tested images from the official main branch may be published.
    if: >-
      github.repository == 'open-telemetry/opentelemetry-packaging' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Publish exactly the packages selected by plan, once all native builds pass.
    strategy:
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-24.04
    # Retain pending publications even when native builds finish out of commit order.
    concurrency:
      group: package-images-publish-${{ matrix.package.component }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read package metadata
        id: metadata
        env:
          COMPONENT: ${{ matrix.package.component }}
        run: go run ./cmd/image-metadata -component "$COMPONENT" >> "$GITHUB_OUTPUT"

      - name: Download tested DEBs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-packages-${{ matrix.package.component }}-*
          path: build/images/${{ matrix.package.component }}
          merge-multiple: true

      - name: Set up multi-architecture image builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Check under the publication lock, allowing different version tags to publish independently.
      - name: Check for superseding inputs for this image tag
        id: freshness
        env:
          COMPONENT: ${{ matrix.package.component }}
        run: |
          git fetch --no-tags origin refs/heads/main
          go run ./cmd/image-metadata -component "$COMPONENT" -publish-ref FETCH_HEAD >> "$GITHUB_OUTPUT"

      - name: Publish multi-architecture image
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/images/${{ matrix.package.component }}
          file: packaging/images/Dockerfile
          platforms: ${{ needs.plan.outputs.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ steps.metadata.outputs.package }}:${{ steps.metadata.outputs.version }}
          build-args: PACKAGE=${{ steps.metadata.outputs.package }}
